name: "Release Plugin"

on:
  workflow_dispatch:

permissions:
    contents: write
    issues: write
    deployments: write
    id-token: write # to enable use of OIDC for npm provenance and trusted publishing

jobs:
  lint:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: ionic-team/capacitor-actions/lint-plugin@v1.0.0
        with:
          working-directory: ./packages/capacitor-plugin
          gh-token: ${{ github.token }}

  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: ionic-team/capacitor-actions/build-plugin@v1.0.0
        with:
          working-directory: ./packages/capacitor-plugin
          gh-token: ${{ github.token }}
  
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: 'Setup Environment'
        id: setup
        uses: ionic-team/capacitor-actions/setup-tools@v1.0.0
        with:
          working-directory: ./packages/capacitor-plugin
          gh-token: ${{ github.token }}
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ github.token }}
          config-file: ${{ github.ref_name == 'next' && 'release-please-config-next.json' || 'release-please-config.json' }}
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  release:
    needs: [ 'release-please', 'lint', 'build']
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: ionic-team/capacitor-actions/release-plugin-npm@v1.0.0
        with:
          working-directory: ./packages/capacitor-plugin
          gh-token: ${{ github.token }}
          npm-tag: ${{ github.ref_name == 'next' && 'next' || 'latest' }}   
