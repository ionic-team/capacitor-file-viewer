name: "Continuous Integrations"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    uses: ./.github/workflows/reusable_lint.yml

  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: ionic-team/capacitor-actions/build-plugin@13886ebbbcde1116551127612c4a1a99b87b261b
        with:
          working-directory: ./packages/capacitor-plugin
          gh-token: ${{ github.token }}

  verify-plugin-android:
    needs: ['lint', 'build']
    runs-on: 'macos-15'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: 'Setup Tools'
        uses: ./.github/actions/setup-tools
      - name: 'Verify Android'
        working-directory: ./packages/capacitor-plugin
        run: npm run verify:android

  verify-plugin-ios:
    needs: ['lint', 'build']
    runs-on: 'macos-15'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: 'Setup Tools'
        uses: ./.github/actions/setup-tools
      - name: 'Verify iOS'
        working-directory: ./packages/capacitor-plugin
        run: npm run verify:ios

